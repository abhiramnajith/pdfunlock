name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job in this workflow needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS so the Rust integration tests have a real qpdf to exercise.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install qpdf
        run: brew install qpdf
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.91.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Frontend tests
        run: npm test
      # tauri-build's build script validates that the frontend dist and the
      # qpdf externalBin exist, so produce both before compiling the crate.
      - name: Build frontend + vendor qpdf sidecar
        run: |
          npm run build
          bash scripts/prepare-qpdf-sidecar.sh
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: npm audit (report-only)
        run: npm audit --omit=dev || true
      - name: cargo audit (report-only)
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock || true

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
